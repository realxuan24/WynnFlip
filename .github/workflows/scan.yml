
name: WynnFlip Market Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: wynnflip-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt


      - name: Check API key
        env:
          WYNNVENTORY_API_KEY: ${{ secrets.WYNNVENTORY_API_KEY }}
        run: |
          if [ -z "$WYNNVENTORY_API_KEY" ]; then
            echo "ERROR: API key is missing"
            exit 1
          else
            echo "SUCCESS: API key is configured"
          fi

      - name: Run market scanner
        env:
          WYNNVENTORY_API_KEY: ${{ secrets.WYNNVENTORY_API_KEY }}
        run: python scanner.py

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Update WynnFlip market data"
            git push
          fi

          
      - name: Upload WynnFlip dashboard
        uses: actions/upload-artifact@v4
        with:
          name: wynnflip-dashboard
          path: site/
          if-no-files-found: error

