name: WynnFlip Market Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: wynnflip-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test analysis
        run: python -m unittest discover -s tests -v
      - name: Refresh permitted Wynnpool reference profiles
        run: python scripts/import_weights.py
      - name: Scan market
        env:
          WYNNVENTORY_API_KEY: ${{ secrets.WYNNVENTORY_API_KEY }}
          MAX_PAGES: "10"
        run: python scanner.py
      - name: Validate output
        run: |
          test -s site/index.html
          test -s site/market.json
          python -m json.tool site/market.json > /dev/null
      - name: Save market observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ site/market.json profiles/item_weights.json
          if ! git diff --cached --quiet; then
            git commit -m "Update WynnFlip market observations"
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/
      - name: Deploy Pages
        uses: actions/deploy-pages@v4
        id: deployment
