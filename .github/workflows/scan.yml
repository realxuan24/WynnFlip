
name: WynnFlip Market Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: wynnflip-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run WynnFlip scanner
        env:
          WYNNVENTORY_API_KEY: ${{ secrets.WYNNVENTORY_API_KEY }}
        run: python scanner.py

     
      - name: Verify website files
        run: |
          echo "Checking WynnFlip files..."
          echo "Files in repository:"
          ls -la
          echo "Files in site folder:"
          ls -la site/ || true

          if [ ! -s site/index.html ]; then
            echo "ERROR: site/index.html is missing or empty"
            exit 1
          fi

          if [ ! -s site/market.json ]; then
            echo "ERROR: site/market.json is missing or empty"
            exit 1
          fi

          if ! python -m json.tool site/market.json > /dev/null; then
            echo "ERROR: market.json contains invalid JSON"
            exit 1
          fi

          echo "SUCCESS: All website files verified"


      - name: Save market history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ site/market.json
          if ! git diff --cached --quiet; then
            git commit -m "Update WynnFlip market data"
            git push
          fi

      - name: Deploy website to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
