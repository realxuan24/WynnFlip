name: WynnFlip Cloud History Collector

on:
  workflow_dispatch:
  schedule:
    # UTC; GitHub schedules may be delayed under load.
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: wynnflip-cloud-history
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect market history in cloud Redis
        env:
          WYNNFLIP_MARKET_URL: https://wynn-flip.vercel.app/api/market
        run: python scripts/cloud_history_scan.py
